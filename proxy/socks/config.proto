syntax = "proto3";

package xray.proxy.socks;
option csharp_namespace = "Xray.Proxy.Socks";
option go_package = "github.com/xtls/xray-core/proxy/socks";
option java_package = "com.xray.proxy.socks";
option java_multiple_files = true;

import "common/net/address.proto";
import "common/protocol/server_spec.proto";
import "common/protocol/user.proto";

// Account represents a Socks account.
message Account {
  string username = 1;
  string password = 2;
}

// AuthType is the authentication type of Socks proxy.
enum AuthType {
  // NO_AUTH is for anonymous authentication.
  NO_AUTH = 0;
  // PASSWORD is for username/password authentication.
  PASSWORD = 1;
}

// 启动账户保留独立凭据和身份。
message UserAccount {
 string username = 1;
 string password = 2;
 reserved 3 to 7;
 reserved "bandwidth_bps", "conn_limit", "committed_bps", "committed_burst_bytes", "class";
 xray.common.protocol.User runtime = 8;
}

// ServerConfig is the protobuf config for Socks server.
message ServerConfig {
  AuthType auth_type = 1;
  map<string, string> accounts = 2;
  xray.common.net.IPOrDomain address = 3;
  bool udp_enabled = 4;
  uint32 user_level = 6;
  // 启动身份与运行时账户共用同一张表。
  repeated UserAccount user_accounts = 7;
}

// ClientConfig is the protobuf config for Socks client.
message ClientConfig {
  // Sever is a list of Socks server addresses.
  xray.common.protocol.ServerEndpoint server = 1;
  // The handshake stages are sent staggered without waiting for replies once
  // the upstream passes a background self-check (fork; see handshake.go,
  // upstream.go). no_pipeline turns it off for this outbound.
  bool no_pipeline = 2;
  // Authenticated connections are kept warm by default (fork; see warm.go).
  // no_prewarm turns it off for this outbound.
  bool no_prewarm = 3;
  // The first payload follows the request without waiting for its reply once
  // the upstream passes the self-check. no_early_data turns it off.
  bool no_early_data = 4;
}
