syntax = "proto3";

package xray.proxy.socks;
option csharp_namespace = "Xray.Proxy.Socks";
option go_package = "github.com/xtls/xray-core/proxy/socks";
option java_package = "com.xray.proxy.socks";
option java_multiple_files = true;

import "common/net/address.proto";
import "common/protocol/server_spec.proto";

// Account represents a Socks account.
message Account {
  string username = 1;
  string password = 2;
}

// AuthType is the authentication type of Socks proxy.
enum AuthType {
  // NO_AUTH is for anonymous authentication.
  NO_AUTH = 0;
  // PASSWORD is for username/password authentication.
  PASSWORD = 1;
}

// UserAccount carries one boot-time user with protocol-agnostic per-user runtime
// limits, so a mixed/socks inbound enforces bandwidth + connection caps for users
// baked in at startup (the runtime AddUser path carries the same limits on the
// top-level protocol.User). 0 means unlimited.
message UserAccount {
  string username = 1;
  string password = 2;
  uint64 bandwidth_bps = 3;
  uint32 conn_limit = 4;
  // Dual-rate shaping, same meaning as protocol.User: committed_bps is the CIR
  // and committed_burst_bytes the CBS. 0 keeps plain single-rate behaviour.
  uint64 committed_bps = 5;
  uint64 committed_burst_bytes = 6;
}

// ServerConfig is the protobuf config for Socks server.
message ServerConfig {
  AuthType auth_type = 1;
  map<string, string> accounts = 2;
  xray.common.net.IPOrDomain address = 3;
  bool udp_enabled = 4;
  uint32 user_level = 6;
  // Per-user accounts with limits. Preferred over `accounts` (which has no
  // limit fields); both are merged at startup into the in-memory user store.
  repeated UserAccount user_accounts = 7;
}

// ClientConfig is the protobuf config for Socks client.
message ClientConfig {
  // Sever is a list of Socks server addresses.
  xray.common.protocol.ServerEndpoint server = 1;
}
