syntax = "proto3";

package xray.proxy.shadowsocks_2022;
option csharp_namespace = "Xray.Proxy.Shadowsocks2022";
option go_package = "github.com/xtls/xray-core/proxy/shadowsocks_2022";
option java_package = "com.xray.proxy.shadowsocks_2022";
option java_multiple_files = true;

import "common/net/network.proto";
import "common/net/address.proto";
import "common/protocol/user.proto";

message ServerConfig {
  string method = 1;
  string key = 2;
  string email = 3;
  int32 level = 4;
  repeated xray.common.net.Network network = 5;
}

message MultiUserServerConfig {
  string method = 1;
  string key = 2;
  repeated xray.common.protocol.User users = 3;
  repeated xray.common.net.Network network = 4;
}

message RelayDestination {
  string key = 1;
  xray.common.net.IPOrDomain address = 2;
  uint32 port = 3;
  string email = 4;
  int32 level = 5;

  // Per-user runtime limits, same four fields as xray.common.protocol.User.
  //
  // Relay mode does not carry a User message: each destination is its own
  // "user", identified by its own PSK. Without these fields the relay inbound
  // had no way to express a limit at all — a customer on a relay line could set
  // any bandwidth cap in the panel and every byte of it was silently dropped on
  // the floor. Silent no-ops are exactly what this fork exists to prevent, so
  // the fields live here and inbound_relay.go turns each destination into one
  // long-lived *protocol.MemoryUser that the dispatcher shapes like any other.
  //
  // 0 means unlimited. See common/protocol/user.proto for the PIR/CIR/CBS
  // semantics — they are identical, this is the same knob on another surface.
  uint64 bandwidth_bps = 6;
  uint32 conn_limit = 7;
  uint64 committed_bps = 8;
  uint64 committed_burst_bytes = 9;

  // class 标识共享同一争抢策略的客户组。权重 / normal_cap / 突发信用是运营参数，
  // 走 app.fairshare.command 的 SetClassPolicy 整份下发，这里只带一个名字。
  string class = 10;
}

message RelayServerConfig {
  string method = 1;
  string key = 2;
  repeated RelayDestination destinations = 3;
  repeated xray.common.net.Network network = 4;
}

message Account {
  string key = 1;
}

message ClientConfig {
  xray.common.net.IPOrDomain address = 1;
  uint32 port = 2;
  string method = 3;
  string key = 4;
}
