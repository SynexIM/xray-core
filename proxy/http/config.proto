syntax = "proto3";

package xray.proxy.http;
option csharp_namespace = "Xray.Proxy.Http";
option go_package = "github.com/xtls/xray-core/proxy/http";
option java_package = "com.xray.proxy.http";
option java_multiple_files = true;

import "common/protocol/server_spec.proto";

message Account {
  string username = 1;
  string password = 2;
}

// UserAccount carries one boot-time user with protocol-agnostic per-user runtime
// limits (bandwidth + connection caps). 0 means unlimited. The runtime AddUser
// path carries the same limits on the top-level protocol.User instead.
message UserAccount {
  string username = 1;
  string password = 2;
  uint64 bandwidth_bps = 3;
  uint32 conn_limit = 4;
  // Dual-rate shaping, same meaning as protocol.User: committed_bps is the CIR
  // and committed_burst_bytes the CBS. 0 keeps plain single-rate behaviour.
  uint64 committed_bps = 5;
  uint64 committed_burst_bytes = 6;

  // class 是争抢等级名（= SKU）。权重 / normal_cap / 突发信用是运营参数，
  // 走 app.fairshare.command 的 SetClassPolicy 整份下发，这里只带一个名字。
  string class = 7;
}

// Config for HTTP proxy server.
message ServerConfig {
  map<string, string> accounts = 2;
  bool allow_transparent = 3;
  uint32 user_level = 4;
  // Per-user accounts with limits. Preferred over `accounts`; both are merged at
  // startup into the in-memory user store.
  repeated UserAccount user_accounts = 5;
}

message Header {
  string key = 1;
  string value = 2;
}

// ClientConfig is the protobuf config for HTTP proxy client.
message ClientConfig {
  // Sever is a list of HTTP server addresses.
  xray.common.protocol.ServerEndpoint server = 1;
  repeated Header header = 2;
}
