syntax = "proto3";

package xray.proxy.http;
option csharp_namespace = "Xray.Proxy.Http";
option go_package = "github.com/xtls/xray-core/proxy/http";
option java_package = "com.xray.proxy.http";
option java_multiple_files = true;

import "common/protocol/server_spec.proto";
import "common/protocol/user.proto";

message Account {
  string username = 1;
  string password = 2;
}

// 启动账户保留独立凭据和身份。
message UserAccount {
 string username = 1;
 string password = 2;
 reserved 3 to 7;
 reserved "bandwidth_bps", "conn_limit", "committed_bps", "committed_burst_bytes", "class";
 xray.common.protocol.User runtime = 8;
}

// Config for HTTP proxy server.
message ServerConfig {
  map<string, string> accounts = 2;
  bool allow_transparent = 3;
  uint32 user_level = 4;
  // 启动身份与运行时账户共用同一张表。
  repeated UserAccount user_accounts = 5;
}

message Header {
  string key = 1;
  string value = 2;
}

// ClientConfig is the protobuf config for HTTP proxy client.
message ClientConfig {
  // Sever is a list of HTTP server addresses.
  xray.common.protocol.ServerEndpoint server = 1;
  repeated Header header = 2;
}
