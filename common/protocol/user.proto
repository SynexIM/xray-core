syntax = "proto3";

package xray.common.protocol;
option csharp_namespace = "Xray.Common.Protocol";
option go_package = "github.com/xtls/xray-core/common/protocol";
option java_package = "com.xray.common.protocol";
option java_multiple_files = true;

import "common/serial/typed_message.proto";

// User is a generic user for all protocols.
message User {
  uint32 level = 1;
  string email = 2;

  // Protocol specific account information. Must be the account proto in one of
  // the proxies.
  xray.common.serial.TypedMessage account = 3;

  // Top-level, protocol-agnostic per-user runtime limits. Carried on User (not
  // inside the protocol account) so EVERY inbound — mixed/socks/http, vless,
  // shadowsocks, trojan — gets the same limits uniformly through ToMemoryUser,
  // instead of each protocol re-implementing a RuntimeLimits() account method.
  // 0 means unlimited. Bandwidth + connection cap + fair-share all key off the
  // resulting *MemoryUser, so the dispatcher enforces them with no protocol code.
  // ⚠️ 单位陷阱（FR-079d）：这里的 `_bps` 是 **比特/秒**（业务单位，面板按 Mbps 展示后 ×1e6）。
  // 而 app/fairshare/command/command.proto 里的 `_bps` 是 **字节/秒**。同一个后缀差 8 倍。
  // 唯一的换算点是 common/protocol/user_limits.go 的 bitsPerSecondToRuntimeBytesPerSecond，
  // 由 common/protocol/node_fairshare_units_test.go 钉死。新增速率字段一律带
  // `_bit_per_sec` / `_byte_per_sec` 后缀，不许再用裸 `_bps`。
  uint64 bandwidth_bps = 4;
  uint32 conn_limit = 5;

  // Dual-rate shaping (PIR / CIR / CBS). Optional on top of bandwidth_bps.
  //
  //   bandwidth_bps          PIR — peak rate, what a burst is allowed to reach
  //   committed_bps          CIR — committed rate, what is sustained forever
  //   committed_burst_bytes  CBS — how much may be spent at PIR before falling
  //                                back to CIR
  //
  // Leaving committed_bps at 0 keeps the plain single-rate behaviour: one
  // bucket at bandwidth_bps. Setting it stacks a second, much deeper bucket
  // behind the peak one — traffic has to clear both, so a fresh line runs at
  // PIR until its burst allowance drains and then settles at CIR.
  //
  // committed_burst_bytes = 0 means "one day of the committed rate", which is
  // the sane default: a customer may spend their daily commitment whenever
  // they like, at full speed, and still never exceed it over the day.
  // committed_bps above bandwidth_bps is meaningless and is ignored.
  uint64 committed_bps = 6;
  uint64 committed_burst_bytes = 7;

  // class 标识这个用户所属的共享争抢策略客户组（如 "live" / "shortvideo"）。
  // 权重、normal_cap、突发信用不放在这里——它们是运营参数，走
  // app.fairshare.command 的 SetClassPolicy 整份下发，这里只带一个名字。
  // 空 = 未分类，落到 class 表里名字为空的那条兜底策略；没有兜底策略就是同权重、无 class 上限。
  string class = 8;
}
