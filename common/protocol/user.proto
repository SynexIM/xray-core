syntax = "proto3";

package xray.common.protocol;
option csharp_namespace = "Xray.Common.Protocol";
option go_package = "github.com/xtls/xray-core/common/protocol";
option java_package = "com.xray.common.protocol";
option java_multiple_files = true;

import "common/serial/typed_message.proto";

// User is a generic user for all protocols.
message User {
  uint32 level = 1;
  string email = 2;

  // Protocol specific account information. Must be the account proto in one of
  // the proxies.
  xray.common.serial.TypedMessage account = 3;

  reserved 4 to 21;
  reserved "bandwidth_bps", "conn_limit", "committed_bps", "committed_burst_bytes", "class", "upload_bandwidth_bps", "upload_peak_bps", "upload_burst_bytes", "download_bandwidth_bps", "download_peak_bps", "download_burst_bytes", "egress_tag", "burst_bit_per_sec", "burst_credit_bytes", "sustained_bit_per_sec", "pool", "endurance_bytes";
}
