syntax = "proto3";

// app.fairshare.command 是 ipipx 魔改：节点级公平限速配置的 gRPC 下发面。
// node-agent 收到 NodeConfig（总带宽 + headroom）后调 SetNodeBandwidth 喂进程内调度器。
package xray.app.fairshare.command;
option csharp_namespace = "Xray.App.FairShare.Command";
option go_package = "github.com/xtls/xray-core/app/fairshare/command";
option java_package = "com.xray.app.fairshare.command";
option java_multiple_files = true;

service FairShareService {
  // SetNodeBandwidth 设置节点整形上限 root_cap（avail_bps，已含 headroom 折算）与地板、拥塞滞回。
  // 0=关闭节点级公平。
  rpc SetNodeBandwidth(SetNodeBandwidthRequest) returns (SetNodeBandwidthResponse) {}

  // SetClassPolicy 整份替换客户组争抢策略表。声明式：没出现在请求里的 class 即被删除。
  // 不另造通道——class 权重、normal_cap、突发信用全走这一个 rpc（FR-079e）。
  rpc SetClassPolicy(SetClassPolicyRequest) returns (SetClassPolicyResponse) {}

  // GetStatus 读调度器运行态。存在的理由是回答运维在「这台节点分配看起来不太对」
  // 时会问的问题——尤其是注水截断，它只表现为「分配有点不公平」，
  // 不暴露出来就没有任何线索指向它。
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {}
}

// ⚠️ 单位陷阱（FR-079d）：本文件里的 `_bps` 后缀一律是 **字节/秒**，
// 而 common/protocol/user.proto 里 User 的 `bandwidth_bps` / `committed_bps` 是 **比特/秒**。
// 同一个后缀两处含义差 8 倍。这三个历史字段不改名（改名会断掉已经在跑的 node-agent），
// 改为在此写死语义，并由 command_units_test.go / node_fairshare_units_test.go 两条断言测试钉住；
// **新增的速率字段一律带 `_byte_per_sec` / `_bit_per_sec` 后缀**，见下方 ClassPolicy。
// 谁要是「顺手统一成同一单位」，那两条测试会红。
message SetNodeBandwidthRequest {
  uint64 avail_bps = 1; // root_cap：节点整形上限，**字节/秒** = total_bandwidth_bps × headroom_pct/100。0=关闭节点级公平。
  uint64 soft_floor_bps = 2; // 公平软地板，**字节/秒**。0 = 无软地板（不是「用默认值」，见 FR-079c）。
  uint64 hard_floor_bps = 3; // 绝对硬地板，**字节/秒**。0 = 无硬地板。地板只在 floor×活跃人数 ≤ root_cap 时生效。

  // 拥塞滞回（FR-076）。都是百分比/计数，没有单位歧义，故不带单位后缀。
  uint32 congestion_enter_percent = 4; // 节点利用率越过该百分比才进入公平模式。0 = 不做拥塞判定，永远公平模式（= 改造前行为）。
  uint32 congestion_exit_percent = 5;  // 回落到该百分比以下才考虑退出。0 或高于 enter 时取 enter。
  uint32 congestion_exit_ticks = 6;    // 需连续多少个 tick（1 tick = 1 秒）低于 exit 才真的退出。0 视为 1。
}

message SetNodeBandwidthResponse {}

// ClassPolicy 是一组客户共享的争抢策略。
// class 名字挂在 User.class 上随实例下发；这张表是运营参数，不进客户界面（FR-079f）。
message ClassPolicy {
  string name = 1; // class 名，与 User.class 对应。空名 = 未分类用户的兜底策略。

  // 拥塞时按 weight 分剩余带宽。0 视为 1。直播应高于短视频。
  uint32 weight = 2;

  // normal_cap：**不拥挤时**这个 class 的单客户最高速率，字节/秒。
  // ⚠️ 这不是保证带宽/CIR（FR-071）：500 客户 × 20Mbps = 10Gbps，物理上不可能承诺。
  // 0 = 该 class 不设 class 级上限（仍受客户自己的 PIR/CIR 与 root_cap 约束）。
  uint64 normal_cap_byte_per_sec = 3;

  // burst_cap：持有突发信用时能冲到的峰值，字节/秒。必须 > normal_cap 才有意义。
  // 0 = 该 class 不给突发。
  uint64 burst_cap_byte_per_sec = 4;

  // burst_credit_bytes：突发信用桶容量（字节）。信用只按「超出 normal_cap 的那部分字节」
  // 扣（FR-078）；低于 normal_cap 时按未用满的差额回补。0 = 不给突发。
  uint64 burst_credit_bytes = 5;

  // floor_ratio_percent：该 class 的地板 = normal_cap × 该百分比。
  // 与全局软地板取较大者，且仍受「地板×活跃人数 ≤ root_cap 才生效」的前提约束（FR-077）。
  // 0 = 该 class 无专属地板。
  uint32 floor_ratio_percent = 6;

  // An admitted reservation is an aggregate floor for all active members of
  // this class, not a per-user cap. Unused capacity immediately returns to the
  // node pool; excess demand may still compete for spare capacity.
  uint64 upload_reserved_byte_per_sec = 7;
  uint64 download_reserved_byte_per_sec = 8;

  // Stable Client UIDs in this reservation. Runtime membership is keyed by
  // User.email (the Client UID), so creation/removal affects established
  // connections without waiting for them to re-authenticate.
  repeated string member_ids = 9;
}

message SetClassPolicyRequest {
  repeated ClassPolicy classes = 1; // 整份替换。空列表 = 清空 class 表（全员同权重、无 class 上限）。
}

message SetClassPolicyResponse {}

message GetStatusRequest {}

message GetStatusResponse {
  uint64 root_cap_byte_per_sec = 1; // 节点整形上限；0 = 节点级公平没开
  bool congested = 2;               // 当前是否处于公平模式（不拥塞时根本不削速）
  uint32 active_members = 3;        // 最近一 tick 的活跃成员数

  // 注水截断（成员极多且天花板各不相同时，轮数用完还没收敛，余下按权重一次分完）。
  // 总额仍不超过 root_cap，但那批成员之间的公平性是近似的。
  // 这四个字段回答运维的三个问题：这一 tick 截断了吗 · 还剩多少成员没轮到 · 持续多久了。
  bool fill_truncated = 4;
  uint32 fill_unresolved_members = 5; // 在 active_members 里的占比才是重点
  uint64 fill_truncated_ticks = 6;    // 已连续截断多少 tick（1 tick = 1 秒）；0 = 当前没截断
  uint64 fill_truncated_total_ticks = 7; // 进程启动以来累计
  uint32 fill_rounds = 8;             // 最近一 tick 实际跑了几轮；等于上限就是撞顶了
}

// Config 命令服务配置（gRPC server 经 RegisterConfig 实例化本服务）。
message Config {}
